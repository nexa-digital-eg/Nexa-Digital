<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" direction="rtl">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25d7ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="heroText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#9feeff"/>
      <stop offset="0.8" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.055"/>
    </pattern>
    <style>
      .font{font-family: Arial, Tahoma, sans-serif;}
      .white{fill:#fff}.muted{fill:#b7c4dc}.cyan{fill:#a5f3fc}.violet{fill:#ddd6fe}.dark{fill:#07101f}
      .card{fill:rgba(255,255,255,.075);stroke:rgba(255,255,255,.16);stroke-width:1.2}
      .small{font-size:24px}.body{font-size:30px}.h2{font-size:54px;font-weight:900}.h1{font-size:74px;font-weight:900}.label{font-size:21px;font-weight:800}.title{font-size:30px;font-weight:900}
    </style>
  </defs>

  <rect width="1440" height="1800" fill="url(#bg)"/>
  <circle cx="1160" cy="120" r="320" fill="#25d7ff" opacity=".16" filter="url(#glow)"/>
  <circle cx="180" cy="190" r="300" fill="#8b5cf6" opacity=".19" filter="url(#glow)"/>
  <rect width="1440" height="780" fill="url(#grid)" opacity=".75"/>

  <!-- Header -->
  <rect x="70" y="38" width="1300" height="88" rx="34" fill="rgba(7,11,24,.72)" stroke="rgba(255,255,255,.12)"/>
  <rect x="1210" y="58" width="56" height="56" rx="18" fill="url(#brand)"/>
  <text x="1238" y="94" text-anchor="middle" class="font dark" font-size="22" font-weight="900">ND</text>
  <text x="1192" y="94" text-anchor="end" class="font white" font-size="29" font-weight="900">Nexa Digital</text>
  <text x="820" y="91" text-anchor="middle" class="font muted" font-size="22" font-weight="800">الخدمات   السيستم المخصص   أعمالنا   الباقات   تواصل</text>
  <rect x="105" y="56" width="170" height="54" rx="27" fill="#ffffff"/>
  <text x="190" y="90" text-anchor="middle" class="font dark" font-size="22" font-weight="900">ابدأ واتساب</text>

  <!-- Hero -->
  <text x="1265" y="235" text-anchor="end" class="font cyan label">● خدمات رقمية احترافية للأفراد والشركات</text>
  <text x="1265" y="325" text-anchor="end" class="font h1" fill="url(#heroText)">حوّل فكرتك أو خدمتك</text>
  <text x="1265" y="408" text-anchor="end" class="font h1" fill="url(#heroText)">إلى حضور رقمي احترافي</text>
  <text x="1265" y="480" text-anchor="end" class="font muted body">من السيرة الذاتية وLinkedIn إلى المواقع والسيستم والأتمتة —</text>
  <text x="1265" y="524" text-anchor="end" class="font muted body">Nexa Digital تساعدك تظهر باحتراف وتشتغل بذكاء.</text>

  <rect x="1048" y="575" width="218" height="62" rx="31" fill="url(#brand)" filter="url(#shadow)"/>
  <text x="1157" y="615" text-anchor="middle" class="font dark" font-size="24" font-weight="900">اطلب خدمتك الآن</text>
  <rect x="812" y="575" width="210" height="62" rx="31" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.18)"/>
  <text x="917" y="615" text-anchor="middle" class="font white" font-size="24" font-weight="900">تواصل واتساب</text>
  <text x="705" y="613" text-anchor="middle" class="font cyan" font-size="24" font-weight="900">شاهد خدماتنا</text>

  <g class="font" font-size="20" font-weight="800">
    <rect x="1140" y="675" width="125" height="42" rx="21" class="card"/><text x="1202" y="703" text-anchor="middle" class="muted">ATS CV</text>
    <rect x="990" y="675" width="120" height="42" rx="21" class="card"/><text x="1050" y="703" text-anchor="middle" class="muted">LinkedIn</text>
    <rect x="820" y="675" width="145" height="42" rx="21" class="card"/><text x="892" y="703" text-anchor="middle" class="muted">Portfolio</text>
    <rect x="650" y="675" width="145" height="42" rx="21" class="card"/><text x="722" y="703" text-anchor="middle" class="muted">Systems</text>
  </g>

  <!-- Hero dashboard -->
  <rect x="95" y="195" width="525" height="520" rx="42" class="card" filter="url(#shadow)"/>
  <rect x="135" y="235" width="445" height="440" rx="30" fill="rgba(2,6,23,.82)" stroke="rgba(255,255,255,.12)"/>
  <text x="535" y="286" text-anchor="end" class="font white title">Nexa Workflow</text>
  <rect x="165" y="258" width="78" height="34" rx="17" fill="rgba(34,197,94,.16)"/><text x="204" y="281" text-anchor="middle" class="font" fill="#bbf7d0" font-size="17" font-weight="900">Live</text>
  <rect x="310" y="325" width="225" height="145" rx="22" fill="rgba(37,215,255,.11)" stroke="rgba(37,215,255,.25)"/>
  <text x="510" y="365" text-anchor="end" class="font cyan" font-size="26" font-weight="900">ATS Score</text>
  <rect x="340" y="392" width="165" height="11" rx="6" fill="rgba(255,255,255,.12)"/><rect x="340" y="392" width="138" height="11" rx="6" fill="#25d7ff"/>
  <text x="510" y="438" text-anchor="end" class="font muted" font-size="19">كلمات مفتاحية + قابلية قراءة</text>
  <rect x="165" y="325" width="225" height="145" rx="22" fill="rgba(139,92,246,.12)" stroke="rgba(139,92,246,.25)"/>
  <text x="360" y="365" text-anchor="end" class="font violet" font-size="26" font-weight="900">LinkedIn SEO</text>
  <text x="360" y="418" text-anchor="end" class="font muted" font-size="19">تموضع مهني واضح</text>
  <rect x="310" y="495" width="225" height="145" rx="22" fill="rgba(34,197,94,.11)" stroke="rgba(34,197,94,.25)"/>
  <text x="510" y="535" text-anchor="end" class="font" fill="#bbf7d0" font-size="26" font-weight="900">Custom System</text>
  <text x="510" y="588" text-anchor="end" class="font muted" font-size="19">CRM • Booking • Reports</text>
  <rect x="165" y="495" width="225" height="145" rx="22" fill="rgba(251,191,36,.1)" stroke="rgba(251,191,36,.24)"/>
  <text x="360" y="535" text-anchor="end" class="font" fill="#fde68a" font-size="26" font-weight="900">Automation + AI</text>
  <text x="360" y="588" text-anchor="end" class="font muted" font-size="19">إشعارات ومساعد ذكي</text>

  <!-- Services preview -->
  <text x="720" y="850" text-anchor="middle" class="font cyan label">خدمات Nexa Digital</text>
  <text x="720" y="920" text-anchor="middle" class="font white h2">كل ما تحتاجه لبناء حضور رقمي قوي وتشغيل أذكى</text>
  <text x="720" y="970" text-anchor="middle" class="font muted" font-size="28">خدمات مترابطة للأفراد والشركات والمواقع والسيستم والأتمتة وأدوات الذكاء الاصطناعي.</text>

  <g class="font">
    <g transform="translate(930 1035)"><rect width="345" height="190" rx="30" class="card"/><rect x="250" y="28" width="66" height="66" rx="20" fill="url(#brand)"/><text x="283" y="70" text-anchor="middle" class="dark" font-size="20" font-weight="900">ATS</text><text x="310" y="118" text-anchor="end" class="white" font-size="27" font-weight="900">سيرة ذاتية ATS</text><text x="310" y="155" text-anchor="end" class="muted" font-size="20">كلمات مفتاحية ومعايير توظيف</text></g>
    <g transform="translate(527 1035)"><rect width="345" height="190" rx="30" class="card"/><rect x="250" y="28" width="66" height="66" rx="20" fill="url(#brand)"/><text x="283" y="70" text-anchor="middle" class="dark" font-size="20" font-weight="900">WEB</text><text x="310" y="118" text-anchor="end" class="white" font-size="27" font-weight="900">مواقع إلكترونية</text><text x="310" y="155" text-anchor="end" class="muted" font-size="20">سريعة ومهيأة للتحويل</text></g>
    <g transform="translate(124 1035)"><rect width="345" height="190" rx="30" class="card"/><rect x="250" y="28" width="66" height="66" rx="20" fill="url(#brand)"/><text x="283" y="70" text-anchor="middle" class="dark" font-size="20" font-weight="900">SYS</text><text x="310" y="118" text-anchor="end" class="white" font-size="27" font-weight="900">سيستم مخصص</text><text x="310" y="155" text-anchor="end" class="muted" font-size="20">CRM ولوحات تحكم وتقارير</text></g>
    <g transform="translate(930 1260)"><rect width="345" height="190" rx="30" class="card"/><rect x="250" y="28" width="66" height="66" rx="20" fill="url(#brand)"/><text x="283" y="70" text-anchor="middle" class="dark" font-size="20" font-weight="900">in</text><text x="310" y="118" text-anchor="end" class="white" font-size="27" font-weight="900">تحسين LinkedIn</text><text x="310" y="155" text-anchor="end" class="muted" font-size="20">تموضع مهني وSEO</text></g>
    <g transform="translate(527 1260)"><rect width="345" height="190" rx="30" class="card"/><rect x="250" y="28" width="66" height="66" rx="20" fill="url(#brand)"/><text x="283" y="70" text-anchor="middle" class="dark" font-size="20" font-weight="900">AUTO</text><text x="310" y="118" text-anchor="end" class="white" font-size="27" font-weight="900">أتمتة الأعمال</text><text x="310" y="155" text-anchor="end" class="muted" font-size="20">إشعارات وتقارير وربط أدوات</text></g>
    <g transform="translate(124 1260)"><rect width="345" height="190" rx="30" class="card"/><rect x="250" y="28" width="66" height="66" rx="20" fill="url(#brand)"/><text x="283" y="70" text-anchor="middle" class="dark" font-size="20" font-weight="900">AI</text><text x="310" y="118" text-anchor="end" class="white" font-size="27" font-weight="900">ذكاء اصطناعي</text><text x="310" y="155" text-anchor="end" class="muted" font-size="20">مساعدات وأدوات للأعمال</text></g>
  </g>

  <!-- Custom system band -->
  <rect x="90" y="1530" width="1260" height="220" rx="42" fill="rgba(139,92,246,.12)" stroke="rgba(37,215,255,.22)" filter="url(#shadow)"/>
  <text x="1240" y="1605" text-anchor="end" class="font violet label">الأهم للمشروعات والشركات</text>
  <text x="1240" y="1665" text-anchor="end" class="font white" font-size="48" font-weight="900">إنشاء سيستم مخصص حسب مشروعك — ليس قالبًا جاهزًا</text>
  <text x="1240" y="1715" text-anchor="end" class="font muted" font-size="25">CRM • مبيعات • حجز • عيادات • مخزون • موافقات • Dashboards • Admin Panels</text>
  <rect x="140" y="1608" width="230" height="66" rx="33" fill="#ffffff"/>
  <text x="255" y="1651" text-anchor="middle" class="font dark" font-size="23" font-weight="900">ناقش السيستم الآن</text>

  <!-- WhatsApp floating -->
  <circle cx="92" cy="1690" r="42" fill="#22c55e" filter="url(#shadow)"/>
  <text x="92" y="1704" text-anchor="middle" class="font dark" font-size="42" font-weight="900">☏</text>
</svg>
